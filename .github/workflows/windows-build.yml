name: Build CHIRP UV-5R Modern for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out patch repository
        uses: actions/checkout@v4

      - name: Check out current official CHIRP
        uses: actions/checkout@v4
        with:
          repository: kk7ds/chirp
          path: chirp-source

      - name: Apply UV-5R Modern patch
        shell: bash
        run: |
          cd chirp-source
          git apply --check ../uv5r-modern.patch
          git apply ../uv5r-modern.patch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: chirp-source/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install `
            wxPython==4.2.5 `
            pyserial `
            requests `
            pywin32 `
            suds `
            yattag `
            lark `
            pytest `
            pyyaml `
            ddt `
            pyinstaller

      - name: Run UV-5R planner tests
        working-directory: chirp-source
        run: python -m pytest -q tests/unit/test_uv5r_setup.py

      - name: Build portable Windows application
        working-directory: chirp-source
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name CHIRP-UV5R-Modern `
            --collect-all chirp `
            --collect-all wx `
            --add-data "chirp/share;chirp/share" `
            --add-data "chirp/stock_configs;chirp/stock_configs" `
            --add-data "chirp/locale;chirp/locale" `
            --hidden-import chirp.share `
            --hidden-import chirp.stock_configs `
            --hidden-import wx.adv `
            --hidden-import wx._xml `
            --hidden-import wx._richtext `
            chirpwx.py

      - name: Verify executable starts
        working-directory: chirp-source
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/CHIRP-UV5R-Modern/CHIRP-UV5R-Modern.exe"
          if ((Get-Item $exe).Length -lt 100000) {
            throw "Built executable is unexpectedly small"
          }
          $wxXml = Get-ChildItem `
            -Path "dist/CHIRP-UV5R-Modern" `
            -Recurse `
            -Filter "*_xml*.pyd"
          $wxRichText = Get-ChildItem `
            -Path "dist/CHIRP-UV5R-Modern" `
            -Recurse `
            -Filter "*_richtext*.pyd"
          if (-not $wxXml) {
            throw "wxPython XML extension is missing from the package"
          }
          if (-not $wxRichText) {
            throw "wxPython RichText extension is missing from the package"
          }
          $resources = @(
            "dist/CHIRP-UV5R-Modern/_internal/chirp/share/chirp.ico",
            "dist/CHIRP-UV5R-Modern/_internal/chirp/share/plus-icon.png",
            "dist/CHIRP-UV5R-Modern/_internal/chirp/share/welcome_screen.png"
          )
          foreach ($resource in $resources) {
            if (-not (Test-Path $resource)) {
              throw "Required CHIRP resource is missing: $resource"
            }
          }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited -and $process.ExitCode -ne 0) {
            throw "Application exited during smoke test with code $($process.ExitCode)"
          }
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id
          }

      - name: Package portable ZIP
        working-directory: chirp-source
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/CHIRP-UV5R-Modern" `
            -DestinationPath "CHIRP-UV5R-Modern-Windows.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CHIRP-UV5R-Modern-Windows
          path: chirp-source/CHIRP-UV5R-Modern-Windows.zip
          if-no-files-found: error
          retention-days: 30
